<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영남고등학교 진로진학 상담 시스템</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- Chart.js 최신 버전 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .break-keep { word-break: keep-all; }
        .bg-school { background-color: #094b83; }
        .text-school { color: #094b83; }
        .border-school { border-color: #094b83; }
        
        /* 상세 표 스타일 */
        .score-table { border-collapse: collapse; min-width: 800px; }
        .score-table th { background-color: #f8fafc; font-weight: bold; border: 1px solid #cbd5e1; padding: 8px 4px; text-align: center; vertical-align: middle; }
        .score-table td { border: 1px solid #e2e8f0; padding: 10px 4px; text-align: center; }
        .score-table tr:hover td { background-color: #f1f5f9; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pt-10 pb-20 px-4 relative overflow-x-hidden">

    <div class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-0 pointer-events-none flex flex-col items-center justify-center" style="opacity: 0.03;">
        <div class="w-96 h-96 rounded-full border-gray-500 flex items-center justify-center" style="border-width: 20px;">
            <span class="text-8xl font-black text-gray-500">YEUNGNAM</span>
        </div>
    </div>

    <div class="w-full z-10 relative" style="max-width: 1400px; margin: 0 auto;">
        <header class="bg-school rounded-2xl shadow-md p-6 mb-16 flex items-center gap-6">
            <div class="bg-white rounded-full w-16 h-16 flex items-center justify-center shadow-inner shrink-0 relative overflow-hidden p-1">
                <div class="w-full h-full border-2 border-school rounded-full flex flex-col items-center justify-center font-bold text-school text-center leading-tight">
                    <span style="font-size: 8px;">YEUNGNAM</span>
                    <span style="font-size: 10px;">영남</span>
                </div>
            </div>
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight mb-1">영남고등학교 진로진학 상담 시스템</h1>
                <p class="text-blue-200 text-sm font-medium">교사용 통합 관리 센터</p>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-6 items-stretch">
            <div class="bg-white rounded-2xl shadow-lg border-b-8 border-blue-500 p-6 flex flex-col items-center text-center hover:-translate-y-2 transition-transform duration-300 cursor-pointer h-full">
                <div class="w-24 h-24 mb-5 flex items-end justify-center"><span class="text-7xl drop-shadow-md">🧑‍🎓</span></div>
                <h2 class="text-xl font-bold mb-4 text-gray-800 break-keep">학생 <span class="text-red-600">개별</span> 조회</h2>
            </div>
            <div class="bg-white rounded-2xl shadow-lg border-b-8 border-green-500 p-6 flex flex-col items-center text-center hover:-translate-y-2 transition-transform duration-300 cursor-pointer h-full">
                <div class="w-24 h-24 mb-5 flex items-end justify-center"><span class="text-7xl drop-shadow-md">🧑‍🤝‍🧑</span></div>
                <h2 class="text-xl font-bold mb-4 text-gray-800 break-keep">반별 <span class="text-red-600">전체</span> 조회</h2>
            </div>
            
            <div onclick="openMockModal()" class="bg-white rounded-2xl shadow-lg border-b-8 border-pink-500 p-6 flex flex-col items-center text-center hover:-translate-y-2 transition-transform duration-300 cursor-pointer h-full relative">
                <div id="cardLoadingSpinner" class="absolute top-4 right-4 flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-pink-500"></span>
                </div>
                <div class="w-24 h-24 mb-5 flex items-center justify-center bg-pink-400 rounded-3xl shadow-inner bg-gradient-to-br from-pink-400 to-pink-500">
                    <span class="text-6xl drop-shadow-md">📈</span>
                </div>
                <h2 class="text-xl font-bold mb-4 text-gray-800 break-keep"><span class="text-red-600">개별</span> 모의고사 성적</h2>
                <p class="text-sm text-gray-600 leading-relaxed break-keep">개별 학생 3년 모의고사 성적 변화 추이</p>
            </div>

            <div class="bg-white rounded-2xl shadow-lg border-b-8 border-red-500 p-6 flex flex-col items-center text-center hover:-translate-y-2 transition-transform duration-300 cursor-pointer h-full">
                <div class="w-24 h-24 mb-5 flex items-end justify-center"><span class="text-7xl drop-shadow-md">🎓</span></div>
                <h2 class="text-xl font-bold mb-4 text-blue-600 break-keep">졸업생 수시 결과</h2>
            </div>
            <div class="bg-white rounded-2xl shadow-lg border-b-8 border-yellow-500 p-6 flex flex-col items-center text-center hover:-translate-y-2 transition-transform duration-300 cursor-pointer h-full">
                <div class="w-24 h-24 mb-5 flex items-center justify-center bg-yellow-500 rounded-3xl shadow-inner bg-gradient-to-br from-yellow-400 to-yellow-600">
                    <span class="text-6xl drop-shadow-md">📝</span>
                </div>
                <h2 class="text-xl font-bold mb-4 text-gray-800 break-keep"><span class="text-red-600">수시</span> 입결 조회</h2>
            </div>
            <div class="bg-white rounded-2xl shadow-lg border-b-8 border-purple-500 p-6 flex flex-col items-center text-center hover:-translate-y-2 transition-transform duration-300 cursor-pointer h-full">
                <div class="w-24 h-24 mb-5 flex items-center justify-center bg-purple-600 rounded-3xl shadow-inner bg-gradient-to-br from-purple-500 to-indigo-600">
                    <span class="text-6xl drop-shadow-md">🎯</span>
                </div>
                <h2 class="text-xl font-bold mb-4 text-blue-600 break-keep"><span class="text-blue-600">정시</span> 입결 조회</h2>
            </div>
        </div>
    </div>

    <!-- 모의고사 모달 -->
    <div id="mockModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full p-6 shadow-2xl overflow-y-auto" style="max-width: 72rem; max-height: 90vh;">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h3 class="text-2xl font-bold text-gray-800">📈 개별 모의고사 성적표</h3>
                <button onclick="closeMockModal()" class="text-gray-400 hover:text-gray-600 text-3xl font-bold">&times;</button>
            </div>

            <div id="errorMessage" class="mb-4 hidden p-4 bg-red-100 text-red-700 rounded-lg font-bold text-sm"></div>

            <div class="mb-6 flex flex-col sm:flex-row gap-4 items-center bg-gray-50 p-4 rounded-lg border border-gray-200">
                <label for="studentSelect" class="font-bold text-gray-700 whitespace-nowrap text-lg">학생 선택 :</label>
                <select id="studentSelect" onchange="renderData()" class="border border-gray-300 rounded-lg p-2 w-full sm:w-80 outline-none bg-white text-lg">
                    <option value="">데이터 로딩 중입니다...</option>
                </select>
            </div>

            <!-- 그래프 영역 -->
            <div class="relative w-full mb-10" style="height: 450px;">
                <canvas id="scoreChart"></canvas>
            </div>
            
            <!-- 표 영역 (자바스크립트로 데이터 채움) -->
            <div id="tableContainer" class="hidden w-full overflow-x-auto pb-4">
                <h4 class="text-xl font-bold text-gray-800 mb-4 pl-2 border-l-4 border-blue-500">📋 월별 모의고사 상세 내역</h4>
                <table class="score-table w-full text-xs sm:text-sm">
                    <thead>
                        <tr>
                            <th rowspan="2" class="w-24">월(고사명)</th>
                            <th colspan="3" class="text-red-600 bg-red-50">국어</th>
                            <th colspan="3" class="text-blue-600 bg-blue-50">수학</th>
                            <th rowspan="2" class="text-gray-800">영어<br>등급</th>
                            <th rowspan="2" class="text-gray-800">한국사<br>등급</th>
                            <th colspan="3" class="text-emerald-600 bg-emerald-50">탐구1</th>
                            <th colspan="3" class="text-purple-600 bg-purple-50">탐구2</th>
                        </tr>
                        <tr>
                            <th class="bg-red-50">표점</th><th class="bg-red-50">백분위</th><th class="bg-red-50">등급</th>
                            <th class="bg-blue-50">표점</th><th class="bg-blue-50">백분위</th><th class="bg-blue-50">등급</th>
                            <th class="bg-emerald-50">표점</th><th class="bg-emerald-50">백분위</th><th class="bg-emerald-50">등급</th>
                            <th class="bg-purple-50">표점</th><th class="bg-purple-50">백분위</th><th class="bg-purple-50">등급</th>
                        </tr>
                    </thead>
                    <tbody id="scoreTableBody">
                        <!-- 데이터가 여기에 들어갑니다 -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        const SHEET_ID = '1psYLHk_Wnl-S-yvkTq9BK80byIxqulTMxlPXHLPB-BM';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;

        let isDataLoaded = false;
        let studentMap = new Map();
        let chartInstance = null;

        document.addEventListener("DOMContentLoaded", fetchSheetData);

        function openMockModal() {
            document.getElementById('mockModal').classList.remove('hidden');
            if(isDataLoaded && document.getElementById('studentSelect').options.length <= 1) {
                populateStudentDropdown();
            }
        }

        function closeMockModal() {
            document.getElementById('mockModal').classList.add('hidden');
        }

        function showError(msg) {
            const errDiv = document.getElementById('errorMessage');
            errDiv.innerHTML = msg;
            errDiv.classList.remove('hidden');
            document.getElementById('studentSelect').innerHTML = '<option value="">오류 발생 (위 메시지 확인)</option>';
            document.getElementById('cardLoadingSpinner').style.display = 'none';
        }

        async function fetchSheetData() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error("네트워크 오류");
                
                const text = await response.text();
                
                if (text.trim().toLowerCase().startsWith("<!doctype html>") || text.includes("<html")) {
                    showError("🚨 구글 시트 공유 권한이 <b>'제한됨'</b>으로 되어있습니다.<br>시트 우측 상단 <b>[공유]</b> 버튼을 눌러 <b>'링크가 있는 모든 사용자'</b>로 변경해주세요.");
                    return;
                }

                Papa.parse(text, {
                    skipEmptyLines: true,
                    complete: function(results) {
                        const data = results.data;
                        
                        let headerIndex = -1;
                        for (let i = 0; i < Math.min(5, data.length); i++) {
                            const rowText = data[i].join('').replace(/\s+/g, '');
                            if (rowText.includes('이름') && rowText.includes('국어') && rowText.includes('수학')) {
                                headerIndex = i;
                                break;
                            }
                        }

                        if (headerIndex === -1) {
                            showError("🚨 <b>데이터 항목(이름, 국어, 수학 등)이 포함된 헤더를 찾을 수 없습니다.</b>");
                            return;
                        }

                        const rawHeaders = data[headerIndex];
                        const headers = rawHeaders.map(h => String(h).replace(/\s+/g, ''));
                        
                        studentMap.clear();

                        // 인덱스 추출 (공백 무시)
                        const idIndex = headers.findIndex(h => h.includes('Number') || h.includes('학번'));
                        const nameIndex = headers.findIndex(h => h.includes('이름') || h.includes('성명'));
                        const titleIndex = headers.findIndex(h => h.includes('학력평가') || h.includes('학력평가명') || h.includes('고사명'));
                        
                        // 국어
                        const korStdIndex = headers.findIndex(h => h.includes('국어표점'));
                        const korPtcIndex = headers.findIndex(h => h.includes('국어백분위'));
                        const korGrdIndex = headers.findIndex(h => h.includes('국어등급'));
                        
                        // 수학
                        const mathStdIndex = headers.findIndex(h => h.includes('수학표점'));
                        const mathPtcIndex = headers.findIndex(h => h.includes('수학백분위'));
                        const mathGrdIndex = headers.findIndex(h => h.includes('수학등급'));
                        
                        // 영어, 한국사
                        const engGrdIndex = headers.findIndex(h => h.includes('영어등급'));
                        const histGrdIndex = headers.findIndex(h => h.includes('한국사등급'));
                        
                        // 탐구1
                        const inq1StdIndex = headers.findIndex(h => h.includes('탐구1표점'));
                        const inq1PtcIndex = headers.findIndex(h => h.includes('탐구1백분위'));
                        const inq1GrdIndex = headers.findIndex(h => h.includes('탐구1등급'));
                        
                        // 탐구2
                        const inq2StdIndex = headers.findIndex(h => h.includes('탐구2표점'));
                        const inq2PtcIndex = headers.findIndex(h => h.includes('탐구2백분위'));
                        const inq2GrdIndex = headers.findIndex(h => h.includes('탐구2등급'));

                        // 그래프용 평균
                        const avgIndex = headers.findIndex(h => h.includes('국수탐백분위평균') || h.includes('국수탐백분위'));

                        if(idIndex === -1 || nameIndex === -1) {
                            showError(`🚨 <b>필수 항목을 찾을 수 없습니다.</b><br>필수: 'Number' 또는 '학번', '이름' <br><br>현재 구글 시트 실제 항목들:<br>[ ${rawHeaders.join(' / ')} ]`);
                            return;
                        }

                        for (let i = headerIndex + 1; i < data.length; i++) {
                            const row = data[i];
                            if (!row || row.length <= idIndex) continue;
                            
                            const studentId = row[idIndex];
                            const studentName = row[nameIndex];
                            
                            if(studentId && studentName) {
                                if(!studentMap.has(studentId)) {
                                    studentMap.set(studentId, { name: studentName, records: [] });
                                }
                                
                                studentMap.get(studentId).records.push({
                                    title: titleIndex !== -1 ? (row[titleIndex] || '') : '',
                                    avg: avgIndex !== -1 ? parseFloat(row[avgIndex]) || null : null,
                                    
                                    korStd: korStdIndex !== -1 ? row[korStdIndex] : '-',
                                    korPtc: korPtcIndex !== -1 ? parseFloat(row[korPtcIndex]) || null : null,
                                    korGrd: korGrdIndex !== -1 ? row[korGrdIndex] : '-',
                                    
                                    mathStd: mathStdIndex !== -1 ? row[mathStdIndex] : '-',
                                    mathPtc: mathPtcIndex !== -1 ? parseFloat(row[mathPtcIndex]) || null : null,
                                    mathGrd: mathGrdIndex !== -1 ? row[mathGrdIndex] : '-',
                                    
                                    engGrd: engGrdIndex !== -1 ? row[engGrdIndex] : '-',
                                    histGrd: histGrdIndex !== -1 ? row[histGrdIndex] : '-',
                                    
                                    inq1Std: inq1StdIndex !== -1 ? row[inq1StdIndex] : '-',
                                    inq1Ptc: inq1PtcIndex !== -1 ? row[inq1PtcIndex] : '-',
                                    inq1Grd: inq1GrdIndex !== -1 ? row[inq1GrdIndex] : '-',
                                    
                                    inq2Std: inq2StdIndex !== -1 ? row[inq2StdIndex] : '-',
                                    inq2Ptc: inq2PtcIndex !== -1 ? row[inq2PtcIndex] : '-',
                                    inq2Grd: inq2GrdIndex !== -1 ? row[inq2GrdIndex] : '-'
                                });
                            }
                        }

                        isDataLoaded = true;
                        document.getElementById('cardLoadingSpinner').style.display = 'none';
                        document.getElementById('errorMessage').classList.add('hidden');
                        
                        if(!document.getElementById('mockModal').classList.contains('hidden')) {
                            populateStudentDropdown();
                        }
                    }
                });
            } catch (error) {
                console.error("Fetch Error:", error);
                showError("데이터를 불러오는 중 네트워크 에러가 발생했습니다.");
            }
        }

        function populateStudentDropdown() {
            const select = document.getElementById('studentSelect');
            if(select.options.length > 1) return;

            select.innerHTML = '';
            const defaultOption = document.createElement('option');
            defaultOption.value = "";
            defaultOption.textContent = "▼ 학번과 이름을 선택하세요";
            select.appendChild(defaultOption);

            const fragment = document.createDocumentFragment();
            const sortedIds = Array.from(studentMap.keys()).sort();

            for(let i = 0; i < sortedIds.length; i++) {
                const id = sortedIds[i];
                const option = document.createElement('option');
                option.value = id;
                option.textContent = `${id} ${studentMap.get(id).name}`;
                fragment.appendChild(option);
            }
            select.appendChild(fragment);
        }

        function renderData() {
            if (typeof Chart === 'undefined') {
                alert("그래프 로딩 중입니다. 잠시 후 시도해주세요.");
                return;
            }

            const select = document.getElementById('studentSelect');
            const studentId = select.value;
            const tableContainer = document.getElementById('tableContainer');
            const tbody = document.getElementById('scoreTableBody');

            if (!studentId || !studentMap.has(studentId)) {
                if (chartInstance) chartInstance.destroy();
                tableContainer.classList.add('hidden');
                return;
            }

            const studentInfo = studentMap.get(studentId);
            const records = studentInfo.records;

            // --- 1. 그래프 그리기 (원래 순서 유지: 과거 -> 현재) ---
            const labels = records.map(r => r.title || '알 수 없음');
            const korPercentiles = records.map(r => r.korPtc);
            const mathPercentiles = records.map(r => r.mathPtc);
            const avgPercentiles = records.map(r => r.avg);

            const ctx = document.getElementById('scoreChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            Chart.defaults.font.size = 14; 
            Chart.defaults.font.family = "'Noto Sans KR', sans-serif";

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '국수탐 평균', data: avgPercentiles, borderColor: '#10b981', backgroundColor: '#10b981', borderWidth: 4, pointRadius: 5, tension: 0 },
                        { label: '국어', data: korPercentiles, borderColor: '#ef4444', backgroundColor: '#ef4444', borderWidth: 2, borderDash: [5, 5], pointRadius: 4, tension: 0 },
                        { label: '수학', data: mathPercentiles, borderColor: '#3b82f6', backgroundColor: '#3b82f6', borderWidth: 2, borderDash: [5, 5], pointRadius: 4, tension: 0 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        title: { display: true, text: `${studentId} ${studentInfo.name} 학생 성적 추이`, font: { size: 20, weight: 'bold' } },
                        legend: { labels: { font: { size: 14 } } },
                        tooltip: { titleFont: { size: 16 }, bodyFont: { size: 14 } }
                    },
                    scales: {
                        y: { 
                            min: 0, 
                            max: 100, 
                            title: { display: true, text: '백분위 (%)', font: { size: 16, weight: 'bold' } },
                            ticks: { font: { size: 14, weight: 'bold' } } 
                        },
                        x: {
                            ticks: { font: { size: 14, weight: 'bold' } } 
                        }
                    }
                }
            });

            // --- 2. 표 그리기 (최신순 내림차순 정렬) ---
            tableContainer.classList.remove('hidden');
            tbody.innerHTML = '';
            
            // 배열을 복사한 뒤 내림차순 정렬
            const sortedRecords = [...records].reverse();

            sortedRecords.forEach(record => {
                const tr = document.createElement('tr');
                
                const val = (v) => (v !== null && v !== undefined && v !== '') ? v : '-';

                tr.innerHTML = `
                    <td class="font-bold text-gray-800 whitespace-nowrap bg-gray-50">${val(record.title)}</td>
                    <!-- 국어 -->
                    <td>${val(record.korStd)}</td>
                    <td>${val(record.korPtc)}</td>
                    <td class="font-bold text-red-600">${val(record.korGrd)}</td>
                    <!-- 수학 -->
                    <td>${val(record.mathStd)}</td>
                    <td>${val(record.mathPtc)}</td>
                    <td class="font-bold text-blue-600">${val(record.mathGrd)}</td>
                    <!-- 영어/한국사 -->
                    <td class="font-bold text-gray-800">${val(record.engGrd)}</td>
                    <td class="font-bold text-gray-800">${val(record.histGrd)}</td>
                    <!-- 탐구1 -->
                    <td>${val(record.inq1Std)}</td>
                    <td>${val(record.inq1Ptc)}</td>
                    <td class="font-bold text-emerald-600">${val(record.inq1Grd)}</td>
                    <!-- 탐구2 -->
                    <td>${val(record.inq2Std)}</td>
                    <td>${val(record.inq2Ptc)}</td>
                    <td class="font-bold text-purple-600">${val(record.inq2Grd)}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
