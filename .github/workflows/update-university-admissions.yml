name: Update university admissions data

on:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * 0"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Fetch university admissions data
        run: python scripts/fetch_university_admissions.py

      - name: Commit updated data
        run: |
          if [[ -n "$(git status --porcelain data/university-admissions)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/university-admissions/*.json
            git commit -m "Update university admissions data"
            git push
          else
            echo "No admissions data changes."
          fi
