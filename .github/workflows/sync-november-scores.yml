name: Sync November score reports

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade google-api-python-client google-auth firebase-admin

      - name: Sync private Google Sheet to Firestore
        env:
          SCORE_SYNC_SERVICE_ACCOUNT_JSON: ${{ secrets.SCORE_SYNC_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_november_scores.py
